name: Build KJV + Strong's Obsidian

on:
  workflow_dispatch:
  schedule:
    - cron: "47 2 1 * *"

permissions:
  contents: read

concurrency:
  group: kjv-strongs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build from CrossWire KJV module
        run: |
          set -euo pipefail
          python scripts/import_kjv_strongs.py

      - name: Validate
        run: |
          set -euo pipefail
          test -s build/build_report.json
          test -s build/source_manifest.json
          test -d build/obsidian-kjv/KJV
          test ! -e build/bible_mt_tr.sqlite
          python tests/test_kjv.py

      - name: Package
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          (cd build && zip -qr ../dist/kjv-strongs-obsidian.zip obsidian-kjv)
          cp build/build_report.json build/source_manifest.json dist/
          sha256sum dist/* > dist/SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kjv-strongs-obsidian-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
